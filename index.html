<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MIXバランス分析</title>
  <meta name="description" content="音源のMIXバランス（周波数・ラウドネス・ステレオ幅・ダイナミクス）をブラウザ内で分析して1枚の画像にまとめます。音声は外部に送信されません。">
  <meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14173f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/archivo-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-state="idle">
  <div class="page">
    <header class="masthead">
      <h1 class="title" data-i18n="app.title">MIXバランス分析</h1>
      <p class="tagline" data-i18n="app.tagline"></p>
    </header>

    <main>
      <section id="drop" class="sheet drop" aria-labelledby="drop-title">
        <div class="drop-body">
          <p id="drop-title" class="drop-title" data-i18n="drop.title"></p>
          <button id="pick" type="button" class="btn primary" data-i18n="drop.button"></button>
          <p class="hint" data-i18n="drop.formats"></p>
        </div>
        <div id="ruler" class="ruler" aria-hidden="true"></div>
        <input id="file" type="file" hidden accept="audio/*,.wav,.wave,.flac,.mp3,.aac,.m4a,.mp4,.ogg,.oga,.opus,.aif,.aiff,.caf">
      </section>

      <section id="busy" class="sheet busy" hidden aria-live="polite">
        <p id="busy-text" class="busy-text"></p>
        <progress id="bar" max="1"></progress>
        <button id="cancel" type="button" class="btn" data-i18n="progress.cancel"></button>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <section id="result" class="result" hidden>
        <div class="actions">
          <label class="preset"><span data-i18n="score.preset.label"></span>
            <select id="preset"></select>
          </label>
          <span class="spacer"></span>
          <button id="zoom" type="button" class="btn" data-i18n="result.zoomIn"></button>
          <button id="again" type="button" class="btn" data-i18n="result.again"></button>
          <button id="share" type="button" class="btn" data-i18n="result.share" hidden></button>
          <button id="save" type="button" class="btn primary" data-i18n="result.save"></button>
        </div>
        <ul id="warnings" class="warnings"></ul>
        <div id="scroller" class="scroller">
          <canvas id="report" role="img"></canvas>
        </div>

        <section id="guide" class="guide" aria-labelledby="guide-title">
          <h2 id="guide-title" data-i18n="gg.title"></h2>
          <div id="guide-reading" class="guide-reading"></div>
          <div id="guide-terms"></div>
        </section>
      </section>
    </main>

    <footer class="foot">
      <p data-i18n="app.privacy"></p>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
